<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Produktfinder – Produkt</title>

<meta
name="description"
content="Produktvergleich und Kaufentscheidungshilfe von Produktfinder."
>

<style>

/* ==================================================
   GRUNDLAGEN
================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f6f7f9;
    color: #17202a;
    line-height: 1.6;
}

a {
    text-decoration: none;
    color: inherit;
}


/* ==================================================
   HEADER
================================================== */

header {
    background: #111827;
    color: white;
}

.header-inner {
    max-width: 1150px;
    margin: auto;
    padding: 16px 20px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 24px;
    font-weight: 800;
}

.logo span {
    color: #f59e0b;
}

nav {
    display: flex;
    gap: 22px;
}

nav a {
    color: white;
    font-size: 14px;
    opacity: 0.9;
}

nav a:hover {
    color: #f59e0b;
}


/* ==================================================
   CONTAINER
================================================== */

.container {
    max-width: 1000px;
    margin: auto;
    padding: 45px 20px;
}


/* ==================================================
   BACK LINK
================================================== */

.back-link {
    display: inline-block;

    margin-bottom: 25px;

    color: #667085;
    font-size: 14px;
    font-weight: bold;
}

.back-link:hover {
    color: #f59e0b;
}


/* ==================================================
   PRODUCT HERO
================================================== */

.product-hero {
    background: white;

    border: 1px solid #eaecf0;

    border-radius: 18px;

    overflow: hidden;

    display: grid;
    grid-template-columns: 0.9fr 1.1fr;

    margin-bottom: 25px;
}

.product-image {
    min-height: 420px;

    background:
        linear-gradient(
            135deg,
            #eef0f3,
            #f8f9fa
        );

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 120px;
}

.product-main {
    padding: 42px;
}

.product-tag {
    display: inline-block;

    background: #fff3d6;
    color: #9a6700;

    padding: 6px 11px;

    border-radius: 6px;

    font-size: 11px;
    font-weight: bold;

    margin-bottom: 15px;
}

.product-main h1 {
    font-size: 38px;
    line-height: 1.2;

    margin-bottom: 15px;
}

.product-intro {
    color: #667085;
    font-size: 16px;

    margin-bottom: 25px;
}

.price {
    font-size: 25px;
    font-weight: 800;

    margin-bottom: 5px;
}

.price-note {
    display: block;

    color: #667085;

    font-size: 12px;
    font-weight: normal;

    margin-bottom: 25px;
}


/* ==================================================
   AMAZON BUTTON
================================================== */

.amazon-button {
    display: inline-block;

    background: #111827;
    color: white;

    padding: 14px 20px;

    border-radius: 9px;

    font-size: 14px;
    font-weight: bold;

    transition: 0.2s ease;
}

.amazon-button:hover {
    background: #1f2937;
    transform: translateY(-1px);
}


/* ==================================================
   INFO BOX
================================================== */

.info-box {
    background: white;

    border: 1px solid #eaecf0;

    border-radius: 16px;

    padding: 30px;

    margin-bottom: 25px;
}

.info-box h2 {
    font-size: 24px;

    margin-bottom: 15px;
}

.info-box p {
    color: #667085;
}


/* ==================================================
   PROS / CONS
================================================== */

.pros-cons {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 20px;

    margin-bottom: 25px;
}

.pros,
.cons {
    background: white;

    border: 1px solid #eaecf0;

    border-radius: 16px;

    padding: 25px;
}

.pros h3,
.cons h3 {
    margin-bottom: 15px;
}

.pros ul,
.cons ul {
    list-style: none;
}

.pros li,
.cons li {
    margin-bottom: 10px;

    font-size: 14px;
}

.pros li {
    color: #166534;
}

.cons li {
    color: #991b1b;
}


/* ==================================================
   RECOMMENDATION
================================================== */

.recommendation {
    background: #111827;
    color: white;

    border-radius: 16px;

    padding: 30px;

    margin-bottom: 25px;
}

.recommendation h2 {
    margin-bottom: 10px;
}

.recommendation p {
    color: #d1d5db;
}


/* ==================================================
   ALTERNATIVE
================================================== */

.alternative {
    background: white;

    border: 1px solid #eaecf0;

    border-radius: 16px;

    padding: 30px;

    margin-bottom: 25px;
}

.alternative h2 {
    margin-bottom: 10px;
}

.alternative p {
    color: #667085;

    margin-bottom: 15px;
}

.alternative-link {
    color: #9a6700;

    font-weight: bold;
}


/* ==================================================
   SOURCES
================================================== */

.sources {
    background: white;

    border: 1px solid #eaecf0;

    border-radius: 16px;

    padding: 30px;

    margin-bottom: 25px;
}

.sources h2 {
    margin-bottom: 12px;
}

.sources p {
    color: #667085;

    font-size: 14px;

    margin-bottom: 12px;
}

.sources a {
    color: #9a6700;

    font-weight: bold;
}


/* ==================================================
   ERROR
================================================== */

.error {
    background: white;

    border: 1px solid #eaecf0;

    border-radius: 16px;

    padding: 40px;

    text-align: center;
}

.error h1 {
    margin-bottom: 10px;
}

.error p {
    color: #667085;

    margin-bottom: 20px;
}


/* ==================================================
   FOOTER
================================================== */

footer {
    background: #0b1120;

    color: #9ca3af;

    text-align: center;

    padding: 35px 20px;

    margin-top: 30px;
}

footer p {
    margin-bottom: 10px;
}

footer a {
    color: #d1d5db;

    margin: 0 8px;

    font-size: 13px;
}


/* ==================================================
   MOBILE
================================================== */

@media (max-width: 700px) {

    nav {
        display: none;
    }

    .container {
        padding: 30px 15px;
    }

    .product-hero {
        grid-template-columns: 1fr;
    }

    .product-image {
        min-height: 280px;
        font-size: 90px;
    }

    .product-main {
        padding: 28px 22px;
    }

    .product-main h1 {
        font-size: 30px;
    }

    .pros-cons {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<!-- ==================================================
     HEADER
================================================== -->

<header>

<div class="header-inner">

<a href="index.html" class="logo">
Produkt<span>finder</span>
</a>

<nav>

<a href="index.html">
Startseite
</a>

<a href="tiktok-finds.html">
TikTok Finds
</a>

<a href="technik.html">
Technik
</a>

<a href="zuhause.html">
Zuhause
</a>

</nav>

</div>

</header>



<main class="container">


<a
href="tiktok-finds.html"
class="back-link"
id="backLink"
>
← Zurück zu TikTok Finds
</a>


<div id="productContainer"></div>


</main>



<footer>

<p>
© Produktfinder
</p>

<p>

<a href="index.html">
Startseite
</a>

<a href="tiktok-finds.html">
TikTok Finds
</a>

</p>

</footer>



<script>

/* ==================================================
   PRODUKTDATEN
================================================== */

const products = {

    "ninja-creami-nc302eu": {

        name: "Ninja CREAMi NC302EU",

        category: "🔥 TIKTOK FIND",

        emoji: "🍦",

        description:
        "Die klassische Ninja CREAMi für selbstgemachte Eiscreme, Sorbet, Gelato und weitere gefrorene Desserts.",

        price: "ca. 190 €",

        priceNote:
        "Preis kann sich ändern.",

        advantages: [

            "CREAMi-Konzept",

            "7 Programme",

            "Mix-In-Funktion",

            "Große Rezeptauswahl"

        ],

        disadvantages: [

            "Grundmasse muss vorher eingefroren werden",

            "Lauter als eine klassische Eismaschine"

        ],

        forWho:
        "Für alle, die das bekannte CREAMi-Konzept ausprobieren möchten, ohne direkt zum größeren Premium-Modell zu greifen.",

        alternative:
        "Wenn du möglichst viele Funktionen möchtest, ist die Ninja CREAMi Deluxe oder Scoop & Swirl interessanter.",

        amazon:
        "https://www.amazon.de/s?k=Ninja+CREAMi+NC302EU",

        source:
        "Die Produktinformationen basieren auf der aktuellen Produktrecherche des Produktfinders."

    },


    "ninja-creami-deluxe": {

        name: "Ninja CREAMi Deluxe",

        category: "⭐ PREIS-LEISTUNG",

        emoji: "🍨",

        description:
        "Mehr Fassungsvermögen und zusätzliche Programme für Nutzer, die besonders vielseitige Desserts zubereiten möchten.",

        price: "ca. 230–300 €",

        priceNote:
        "Je nach Angebot und Variante.",

        advantages: [

            "Größeres Fassungsvermögen",

            "9 Programme",

            "Sehr vielseitig",

            "Re-Spin & Mix-In"

        ],

        disadvantages: [

            "Höherer Preis",

            "Größeres Gerät"

        ],

        forWho:
        "Für Nutzer, die regelmäßig verschiedene Desserts ausprobieren und mehr Möglichkeiten benötigen.",

        alternative:
        "Wenn du weniger ausgeben möchtest, kann eine günstigere Alternative mit ähnlichem Funktionsprinzip interessant sein.",

        amazon:
        "https://www.amazon.de/s?k=Ninja+CREAMi+Deluxe+NC501EU",

        source:
        "Die Produktinformationen basieren auf der aktuellen Produktrecherche des Produktfinders."

    },


    "ninja-creami-scoop-swirl": {

        name: "Ninja CREAMi Scoop & Swirl",

        category: "🏆 PREMIUM",

        emoji: "🍦",

        description:
        "Das umfangreichste Modell der Auswahl mit 13 Programmen und zusätzlicher Softeis-Funktion.",

        price: "ca. 300 €",

        priceNote:
        "Aktueller Preis kann schwanken.",

        advantages: [

            "13 Programme",

            "Softeis-Funktion",

            "CREAMiFit",

            "Mix-In",

            "Sehr vielseitig"

        ],

        disadvantages: [

            "Höchster Preis",

            "Nicht jeder benötigt alle Funktionen"

        ],

        forWho:
        "Für Nutzer, die möglichst viele Möglichkeiten haben möchten und besonders die Softeis-Funktion interessant finden.",

        alternative:
        "Wenn du nicht alle Funktionen benötigst, sind die günstigeren CREAMi-Modelle wahrscheinlich sinnvoller.",

        amazon:
        "https://www.amazon.de/s?k=Ninja+CREAMi+Scoop+Swirl+NC702EU",

        source:
        "Die Produktinformationen basieren auf der aktuellen Produktrecherche des Produktfinders."

    },


    "cuisinart-freezewand-icefd10e": {

        name: "Cuisinart FreezeWand ICEFD10E",

        category: "💰 PREIS-LEISTUNGS-TIPP",

        emoji: "🍦",

        description:
        "Der FreezeWand verfolgt ein ähnliches Grundprinzip wie die Ninja CREAMi: Die vorbereitete Masse wird eingefroren und anschließend verarbeitet.",

        price: "ca. 69 €",

        priceNote:
        "Preis kann sich ändern.",

        advantages: [

            "Ähnliches Grundprinzip",

            "3 Behälter",

            "5 Programme",

            "Eis, Sorbet & Milchshake",

            "Kompakt"

        ],

        disadvantages: [

            "Weniger Programme als Premium-Modelle",

            "Nicht identisch mit der Ninja CREAMi"

        ],

        forWho:
        "Für Nutzer, die ein ähnliches Prinzip ausprobieren möchten und dabei deutlich weniger ausgeben wollen.",

        alternative:
        "Die Ninja CREAMi bietet das etablierte CREAMi-Konzept mit mehr Funktionen.",

        amazon:
        "https://www.amazon.de/s?k=Cuisinart+FreezeWand+ICEFD10E",

        source:
        "Die Produktinformationen basieren auf der aktuellen Produktrecherche des Produktfinders."

    }

};



/* ==================================================
   PRODUKT AUS URL AUSLESEN
================================================== */

const params = new URLSearchParams(window.location.search);

const productId = params.get("id");

const product = products[productId];

const container =
document.getElementById("productContainer");


/* ==================================================
   PRODUKT NICHT GEFUNDEN
================================================== */

if (!product) {

    document.title =
    "Produkt nicht gefunden – Produktfinder";

    container.innerHTML = `

        <div class="error">

            <h1>
                Produkt nicht gefunden
            </h1>

            <p>
                Dieses Produkt konnte leider nicht gefunden werden.
            </p>

            <a
            href="tiktok-finds.html"
            class="amazon-button"
            >
                Zu den TikTok Finds
            </a>

        </div>

    `;

}


/* ==================================================
   PRODUKT ANZEIGEN
================================================== */

else {

    document.title =
    product.name + " – Produktfinder";


    container.innerHTML = `

        <article class="product-hero">

            <div class="product-image">
                ${product.emoji}
            </div>


            <div class="product-main">

                <span class="product-tag">
                    ${product.category}
                </span>


                <h1>
                    ${product.name}
                </h1>


                <p class="product-intro">
                    ${product.description}
                </p>


                <div class="price">
                    ${product.price}
                </div>


                <span class="price-note">
                    ${product.priceNote}
                </span>


                <a
                href="${product.amazon}"
                class="amazon-button"
                target="_blank"
                rel="nofollow sponsored noopener"
                >
                    Bei Amazon ansehen →
                </a>

            </div>

        </article>



        <section class="info-box">

            <h2>
                🔎 Was solltest du wissen?
            </h2>

            <p>
                Wir schauen nicht nur darauf, ob ein Produkt viral ist.
                Entscheidend ist, ob es tatsächlich einen sinnvollen
                Mehrwert bietet und für wen sich der Kauf lohnt.
            </p>

        </section>



        <section class="pros-cons">


            <div class="pros">

                <h3>
                    ✅ Vorteile
                </h3>

                <ul>

                    ${product.advantages
                    .map(item => `<li>✓ ${item}</li>`)
                    .join("")}

                </ul>

            </div>



            <div class="cons">

                <h3>
                    ❌ Nachteile
                </h3>

                <ul>

                    ${product.disadvantages
                    .map(item => `<li>✕ ${item}</li>`)
                    .join("")}

                </ul>

            </div>


        </section>



        <section class="recommendation">

            <h2>
                💡 Für wen lohnt sich das Produkt?
            </h2>

            <p>
                ${product.forWho}
            </p>

        </section>



        <section class="alternative">

            <h2>
                💰 Gibt es eine Alternative?
            </h2>

            <p>
                ${product.alternative}
            </p>

            <a
            href="tiktok-finds.html"
            class="alternative-link"
            >
                Weitere Vergleiche ansehen →
            </a>

        </section>



        <section class="sources">

            <h2>
                📚 Quellen & Transparenz
            </h2>

            <p>
                ${product.source}
            </p>

            <p>
                Preise können sich ändern.
                Prüfe den aktuellen Preis beim Händler.
            </p>

        </section>

    `;

}

</script>


</body>

</html>
