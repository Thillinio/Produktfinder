<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Produktfinder – Praktische Produkte & Gadgets entdecken</title>

    <meta name="description"
          content="Produktfinder entdeckt praktische Gadgets, nützliche Produkte und clevere Helfer für den Alltag.">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f6f7f9;
            color: #17202a;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* HEADER */

        header {
            background: #111827;
            color: white;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            max-width: 1150px;
            margin: auto;
            padding: 16px 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
        }

        .logo span {
            color: #f59e0b;
        }

        nav {
            display: flex;
            gap: 22px;
        }

        nav a {
            color: #ffffff;
            font-size: 14px;
            opacity: 0.9;
        }

        nav a:hover {
            opacity: 1;
        }

        /* HERO */

        .hero {
            background: #ffffff;
            padding: 75px 20px 65px;
            text-align: center;
        }

        .hero-content {
            max-width: 800px;
            margin: auto;
        }

        .hero-label {
            display: inline-block;
            background: #fff3d6;
            color: #9a6700;
            padding: 7px 14px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .hero h1 {
            font-size: 46px;
            line-height: 1.15;
            margin-bottom: 20px;
        }

        .hero h1 span {
            color: #f59e0b;
        }

        .hero p {
            max-width: 650px;
            margin: auto;
            color: #667085;
            font-size: 18px;
        }

        /* SEARCH */

        .search-box {
            max-width: 650px;
            margin: 30px auto 0;

            display: flex;
            background: white;
            border: 1px solid #d9dde3;
            border-radius: 12px;
            padding: 5px;
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            padding: 13px;
            font-size: 15px;
            min-width: 0;
        }

        .search-box button {
            border: none;
            background: #111827;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* MAIN */

        .container {
            max-width: 1150px;
            margin: auto;
            padding: 55px 20px;
        }

        .section {
            margin-bottom: 65px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: end;
            margin-bottom: 25px;
        }

        .section-header h2 {
            font-size: 30px;
        }

        .section-header p {
            color: #667085;
            font-size: 14px;
        }

        /* CATEGORIES */

        .categories {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 15px;
        }

        .category {
            background: white;
            border-radius: 14px;
            padding: 22px 12px;
            text-align: center;
            border: 1px solid #eaecf0;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .category:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .category-icon {
            font-size: 35px;
            margin-bottom: 8px;
        }

        .category strong {
            display: block;
            font-size: 15px;
        }

        .category small {
            color: #667085;
            font-size: 12px;
        }

        /* PRODUCT CARDS */

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #eaecf0;
        }

        .product-image {
            height: 180px;
            background: #eef0f3;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 65px;
        }

        .product-content {
            padding: 22px;
        }

        .tag {
            display: inline-block;
            background: #f2f4f7;
            padding: 5px 9px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .product-content h3 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .product-content p {
            color: #667085;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .button {
            display: inline-block;
            background: #111827;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
        }

        /* PRICE SECTIONS */

        .price-boxes {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .price-box {
            background: white;
            border-radius: 15px;
            padding: 30px;
            border: 1px solid #eaecf0;
        }

        .price-box .emoji {
            font-size: 35px;
            margin-bottom: 12px;
        }

        .price-box h3 {
            font-size: 22px;
            margin-bottom: 8px;
        }
